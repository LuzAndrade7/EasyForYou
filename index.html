<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EAS for you - Login</title>
  <link rel="icon" type="image/svg+xml" href="./frontend/images/favicon.svg" />
  <link rel="stylesheet" href="./frontend/styles.css" />
</head>
<body class="auth-page">
  <main class="container">
    <h1>EAS for you</h1>
    <p class="muted">Inicia sesión para continuar</p>

    <div class="card">
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label>
          Correo
          <input type="email" id="logEmail" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="logPassword" required />
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p id="msg" class="msg"></p>
      <p class="register-link">
        ¿No tienes cuenta? <a href="./frontend/register.html">Regístrate aquí</a>
      </p>
    </div>
  </main>

  <!-- Firebase JS SDKs (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Tus scripts -->
  <script src="./frontend/js/firebaseClient.js"></script>
  <script src="./frontend/js/loginRoot.js"></script>
</body>
</html>
